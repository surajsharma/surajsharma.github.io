name: experience

on:
  workflow_dispatch:
  schedule:
    # Use off-peak minute (17) instead of 0 to avoid GitHub Actions scheduler queue congestion/drops
    - cron: "17 * * * *"

jobs:
  update-experience:
    runs-on: ubuntu-latest
    env:
      FB_API_KEY: ${{ secrets.FB_API_KEY }}
      FB_EXP_RTDB_URL: ${{ secrets.FB_EXP_RTDB }}
      FB_EXP_UPDATE_URL: ${{ secrets.FB_UPDATE_EXP_URL }}
    steps:
      - name: Update Experience Counter
        shell: bash
        run: |
          set -eo pipefail

          if [ -z "$FB_API_KEY" ] || [ -z "$FB_EXP_RTDB_URL" ] || [ -z "$FB_EXP_UPDATE_URL" ]; then
            echo "::error::Required secrets (FB_API_KEY, FB_EXP_RTDB, FB_UPDATE_EXP_URL) are missing!"
            exit 1
          fi

          echo "1. Fetching current experience count..."
          RAW_EXP=$(curl -sSf "$FB_EXP_RTDB_URL")
          EXPERIENCE_NUMBER=$(echo "$RAW_EXP" | jq -r 'if type == "object" then .experience else . end')
          NEW_EXPERIENCE_NUMBER=$((EXPERIENCE_NUMBER + 1))
          echo "   Current: $EXPERIENCE_NUMBER -> Next: $NEW_EXPERIENCE_NUMBER"

          echo "2. Authenticating with Firebase Auth..."
          AUTH_RES=$(curl -sSf -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$FB_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary '{"returnSecureToken":true}')
          AUTH_TOKEN=$(echo "$AUTH_RES" | jq -re .idToken)

          echo "3. Updating Firebase Realtime Database..."
          curl -sSf -X PATCH \
            -H "Content-Type: application/json" \
            -d "{\"experience\": $NEW_EXPERIENCE_NUMBER}" \
            "$FB_EXP_UPDATE_URL?auth=$AUTH_TOKEN"

          echo "4. Success! Experience counter updated to $NEW_EXPERIENCE_NUMBER."
